<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>Hydro Star CRM</title>
<style>
:root{--navy:#102a43;--navy2:#183b56;--blue:#247ba0;--cyan:#dff4f7;--bg:#f3f6fa;--card:#fff;--text:#182b3a;--muted:#66788a;--line:#e1e8ef;--green:#177245;--red:#b42318;--shadow:0 8px 28px #102a4310}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--navy);color:white;padding:25px 16px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;gap:12px;align-items:center;padding:0 8px}.logo{width:42px;height:42px;border-radius:13px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:20px}.brand strong{display:block;font-size:17px;letter-spacing:.2px}.brand small{color:#b9d4e3}.nav{display:grid;gap:7px}.nav button{background:transparent;border:0;color:#d2e1eb;padding:12px 13px;border-radius:10px;text-align:left;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:var(--navy2);color:white}.nav .ico{width:22px;text-align:center;font-size:17px}.sidefoot{margin-top:auto;color:#b9d4e3;font-size:12px;padding:8px}.main{min-width:0}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:12px}.topbar .eyebrow{color:var(--muted);font-size:12px}.topbar h1{font-size:21px;margin:2px 0 0}.top-actions{display:flex;gap:10px;align-items:center}.pill{border-radius:999px;background:#e8f7ee;color:var(--green);padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap}.content{padding:28px;max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.welcome h2{font-size:25px;margin:0 0 5px}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 14px;border-radius:9px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{filter:brightness(.98);box-shadow:0 2px 8px #102a4310}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}.btn.danger{color:var(--red);border-color:#f2c5c2}.btn.smallbtn{padding:6px 9px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:19px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.stat-icon{background:var(--cyan);color:var(--navy);width:35px;height:35px;border-radius:10px;display:grid;place-items:center;font-size:17px}.stat strong{display:block;font-size:27px;margin:12px 0 2px;letter-spacing:-.5px}.stat small{color:var(--muted)}.dashboard-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:17px}.panel{padding:20px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-head h3{margin:0;font-size:16px}.empty{padding:28px 10px;text-align:center;color:var(--muted)}.empty .emptyico{font-size:28px;margin-bottom:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;background:#f8fafc}th,td{padding:12px 11px;border-bottom:1px solid var(--line)}td{font-size:13px}tbody tr:last-child td{border-bottom:0}.tag{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;background:#edf2f7;color:#46586a}.tag.green{background:#e5f7ed;color:#177245}.tag.yellow{background:#fff4d6;color:#885b00}.tag.blue{background:#e3f2fc;color:#165b88}.tag.red{background:#ffebe9;color:#b42318}.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;display:grid;gap:7px}.quick:hover{border-color:#8bc5d7;background:#f9feff}.quick .qi{font-size:22px}.quick strong{font-size:13px}.quick span:last-child{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.search{flex:1;min-width:190px;position:relative}.search input{width:100%;padding:11px 12px 11px 37px;border:1px solid var(--line);border-radius:9px;background:white;outline:none}.search:before{content:"⌕";position:absolute;left:13px;top:7px;font-size:22px;color:var(--muted)}.filter{padding:10px;border:1px solid var(--line);border-radius:9px;background:white}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#4d6072}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d7e0e8;border-radius:9px;background:#fff;outline:none;color:var(--text)}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #247ba018}.field textarea{min-height:90px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.form-panel{max-width:800px}.hidden{display:none!important}.detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.detail-item{padding:13px;background:#f7fafc;border-radius:10px}.detail-item small{display:block;color:var(--muted);margin-bottom:4px}.detail-item strong{overflow-wrap:anywhere}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{border:1px solid #f3dfaa;background:#fff9e8;border-radius:11px;padding:13px 15px;color:#79591b;font-size:13px;margin-bottom:18px}.notice strong{display:block;margin-bottom:3px}.storage-line{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#24a46d}.mobile-menu{display:none}
@media(max-width:1000px){.app{grid-template-columns:210px 1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}.content{padding:22px}.sidebar{padding:22px 12px}}
@media(max-width:700px){.app{display:block}.sidebar{display:none;position:fixed;z-index:10;inset:0 auto 0 0;width:260px;box-shadow:0 0 0 100vmax #06172588}.sidebar.open{display:flex}.mobile-menu{display:inline-flex}.topbar{padding:0 15px;height:68px}.topbar h1{font-size:18px}.topbar .eyebrow,.top-actions .pill{display:none}.content{padding:18px 13px}.welcome{align-items:flex-start;flex-direction:column}.welcome h2{font-size:22px}.stats{gap:10px}.stat{padding:14px}.stat strong{font-size:23px}.stat-top{font-size:12px}.stat-icon{width:30px;height:30px}.quick-actions{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}.form-grid,.detail{grid-template-columns:1fr}.field.full{grid-column:auto}.top-actions .btn{padding:8px 10px}.panel{padding:15px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">H</div><div><strong>HYDRO STAR</strong><small>CRM • Gestão</small></div></div>
 <nav class="nav" id="nav">
  <button class="active" data-page="dashboard"><span class="ico">⌂</span> Visão geral</button>
  <button data-page="clients"><span class="ico">♙</span> Clientes</button>
  <button data-page="quotes"><span class="ico">▤</span> Orçamentos</button>
  <button data-page="services"><span class="ico">⚒</span> Ordens de serviço</button>
  <button data-page="settings"><span class="ico">⚙</span> Dados e configurações</button>
 </nav>
 <div class="sidefoot">Versão inicial • Dados locais<br>Feito para Hydro Star</div>
</aside>
<main class="main">
 <header class="topbar">
  <div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="mobileMenu" aria-label="Abrir menu">☰</button><div><div class="eyebrow">HYDRO STAR / CRM</div><h1 id="pageTitle">Visão geral</h1></div></div>
  <div class="top-actions"><span class="pill">● Armazenamento local</span><button class="btn primary" id="headerAdd">＋ Novo cadastro</button></div>
 </header>
 <section class="content" id="content"></section>
</main>
</div>
<div id="modalRoot"></div>
<input id="importFile" type="file" accept="application/json,.json" class="hidden">
<script>
(() => {
"use strict";
const DB_NAME="hydro-star-crm-local", DB_VERSION=1, STORE="records";
const state={page:"dashboard",clients:[],quotes:[],services:[],search:"",filter:"all"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const date=n=>n?new Date(n+"T12:00:00").toLocaleDateString("pt-BR"): "—";
const today=()=>new Date().toISOString().slice(0,10);
const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
function openDB(){return new Promise((resolve,reject)=>{if(!("indexedDB"in window)){resolve(null);return}const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"key"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
let db=null, fallback=false;
async function readAll(){if(db&&!fallback)return new Promise((resolve,reject)=>{const req=db.transaction(STORE,"readonly").objectStore(STORE).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)});try{return JSON.parse(localStorage.getItem(DB_NAME)||"[]")}catch{return []}}
async function saveRecord(record){if(db&&!fallback)return new Promise((resolve,reject)=>{const req=db.transaction(STORE,"readwrite").objectStore(STORE).put(record);req.onsuccess=resolve;req.onerror=()=>reject(req.error)});const all=await readAll();const idx=all.findIndex(x=>x.key===record.key);if(idx<0)all.push(record);else all[idx]=record;localStorage.setItem(DB_NAME,JSON.stringify(all))}
async function removeRecord(key){if(db&&!fallback)return new Promise((resolve,reject)=>{const req=db.transaction(STORE,"readwrite").objectStore(STORE).delete(key);req.onsuccess=resolve;req.onerror=()=>reject(req.error)});localStorage.setItem(DB_NAME,JSON.stringify((await readAll()).filter(x=>x.key!==key)))}
async function load(){try{db=await openDB();if(!db)fallback=true}catch{fallback=true}const all=await readAll();state.clients=all.filter(x=>x.type==="client").map(x=>x.data);state.quotes=all.filter(x=>x.type==="quote").map(x=>x.data);state.services=all.filter(x=>x.type==="service").map(x=>x.data)}
async function persist(type,data){await saveRecord({key:type+":"+data.id,type,data,updatedAt:new Date().toISOString()});await load();render()}
function nav(page){state.page=page;state.search="";state.filter="all";$("#sidebar").classList.remove("open");render()}
const titles={dashboard:"Visão geral",clients:"Clientes",quotes:"Orçamentos",services:"Ordens de serviço",settings:"Dados e configurações"};
function clientName(clientId){return state.clients.find(c=>c.id===clientId)?.name||"Cliente removido"}
function statusTag(status){const cls={"Aprovado":"green","Concluído":"green","Em andamento":"blue","Pendente":"yellow","Enviado":"blue","Cancelado":"red","Agendado":"yellow"}[status]||"";return '<span class="tag '+cls+'">'+esc(status||"Pendente")+'</span>'}
function empty(icon,title,desc,action,label){return '<div class="empty"><div class="emptyico">'+icon+'</div><strong>'+title+'</strong><p>'+desc+'</p>'+(action?'<button class="btn primary" data-action="'+action+'">'+label+'</button>':'')+'</div>'}
function stat(icon,label,value,sub){return '<article class="stat"><div class="stat-top"><span>'+label+'</span><span class="stat-icon">'+icon+'</span></div><strong>'+value+'</strong><small>'+sub+'</small></article>'}
function table(headers,rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join("")+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
function dashboard(){const pending=state.quotes.filter(q=>!["Aprovado","Cancelado"].includes(q.status));const open=state.services.filter(s=>!["Concluído","Cancelado"].includes(s.status));const total=state.quotes.filter(q=>q.status==="Aprovado").reduce((a,q)=>a+Number(q.value||0),0);const recent=[...state.services.map(s=>({...s,_kind:"service"})),...state.quotes.map(q=>({...q,_kind:"quote"}))].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,5);const recentRows=recent.map(x=>'<tr><td><strong>'+esc(x.title||x.description||"Registro")+'</strong><br><span class="muted small">'+esc(clientName(x.clientId))+'</span></td><td>'+ (x._kind==="quote"?"Orçamento":"Serviço")+'</td><td>'+statusTag(x.status)+'</td><td>'+money(x.value)+'</td></tr>').join("");return '<div class="welcome"><div><h2>Olá, Hydro Star 👋</h2><div class="muted">Aqui está um resumo da sua operação.</div></div><button class="btn primary" data-action="new-quote">＋ Criar orçamento</button></div><div class="notice"><strong>🔒 Seus dados ficam neste navegador</strong>Esta versão não usa Firebase nem envia cadastros para o GitHub. Faça backups em “Dados e configurações” e evite limpar os dados do navegador.</div><div class="stats">'+stat("♙","Clientes",state.clients.length,"Cadastros salvos localmente")+stat("▤","Orçamentos",state.quotes.length,pending.length+" aguardando decisão")+stat("⚒","Serviços em aberto",open.length,"Ordens não concluídas")+stat("R$","Orçamentos aprovados",money(total),"Soma dos valores aprovados")+'</div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><h3>Atividade recente</h3><button class="btn smallbtn" data-nav="services">Ver serviços</button></div>'+(recentRows?table(["Registro","Tipo","Status","Valor"],recentRows):empty("▤","Ainda não há registros","Cadastre seu primeiro cliente ou orçamento.","new-client","＋ Cadastrar cliente"))+'</section><section class="panel"><div class="panel-head"><h3>Acesso rápido</h3></div><div class="quick-actions"><button class="quick" data-action="new-client"><span class="qi">♙</span><strong>Novo cliente</strong><span>Cadastre um contato</span></button><button class="quick" data-action="new-quote"><span class="qi">▤</span><strong>Novo orçamento</strong><span>Registre valores e status</span></button><button class="quick" data-action="new-service"><span class="qi">⚒</span><strong>Nova ordem de serviço</strong><span>Organize um atendimento</span></button></div><div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)"><div class="storage-line"><span class="dot"></span><span>Banco local ativo • <b>'+ (fallback?"localStorage":"IndexedDB")+'</b></span></div><p class="muted small">Dica: exporte um backup periodicamente e guarde-o em um local seguro.</p></div></section></div>'}
function searchBar(placeholder,button,filters=""){return '<div class="toolbar"><div class="search"><input id="searchInput" placeholder="'+placeholder+'" value="'+esc(state.search)+'"></div>'+filters+'<button class="btn primary" data-action="'+button+'">＋ Novo</button></div>'}
function clientsPage(){let items=state.clients.filter(c=>(c.name+" "+(c.phone||"")+" "+(c.city||"")+" "+(c.email||"")).toLowerCase().includes(state.search.toLowerCase()));let rows=items.map(c=>'<tr><td><strong>'+esc(c.name)+'</strong><br><span class="muted small">'+esc(c.email||"Sem e-mail")+'</span></td><td>'+esc(c.phone||"—")+'</td><td>'+esc(c.city||"—")+'</td><td>'+esc(c.kind||"Residencial")+'</td><td><button class="btn smallbtn" data-edit="client" data-id="'+c.id+'">Editar</button> <button class="btn smallbtn danger" data-delete="client" data-id="'+c.id+'">Excluir</button></td></tr>').join("");return '<div class="welcome"><div><h2>Clientes</h2><div class="muted">Organize contatos e informações de atendimento.</div></div></div>'+searchBar("Buscar por nome, telefone ou cidade…","new-client")+'<section class="panel">'+(rows?table(["Cliente","Telefone","Cidade","Perfil","Ações"],rows):empty("♙",state.clients.length?"Nenhum cliente encontrado":"Nenhum cliente cadastrado",state.clients.length?"Tente outro termo de busca.":"Adicione o primeiro cliente para começar.","new-client","＋ Novo cliente"))+'</section>'}
function quotesPage(){let items=state.quotes.filter(q=>(q.title+" "+clientName(q.clientId)+" "+q.status).toLowerCase().includes(state.search.toLowerCase())&&(state.filter==="all"||q.status===state.filter));let rows=items.map(q=>'<tr><td><strong>'+esc(q.title)+'</strong><br><span class="muted small">'+esc(clientName(q.clientId))+'</span></td><td>'+date(q.date)+'</td><td>'+statusTag(q.status)+'</td><td><strong>'+money(q.value)+'</strong></td><td><button class="btn smallbtn" data-edit="quote" data-id="'+q.id+'">Editar</button> <button class="btn smallbtn danger" data-delete="quote" data-id="'+q.id+'">Excluir</button></td></tr>').join("");return '<div class="welcome"><div><h2>Orçamentos</h2><div class="muted">Registre serviços, valores e acompanhe a decisão do cliente.</div></div></div>'+searchBar("Buscar por serviço ou cliente…","new-quote",'<select class="filter" id="filterSelect"><option value="all">Todos os status</option>'+["Pendente","Enviado","Aprovado","Cancelado"].map(x=>'<option '+(state.filter===x?"selected":"")+'>'+x+'</option>').join("")+'</select>')+'<section class="panel">'+(rows?table(["Orçamento / cliente","Data","Status","Valor","Ações"],rows):empty("▤","Nenhum orçamento encontrado","Crie um orçamento para acompanhar a negociação.","new-quote","＋ Novo orçamento"))+'</section>'}
function servicesPage(){let items=state.services.filter(s=>(s.title+" "+clientName(s.clientId)+" "+s.status+" "+(s.address||"")).toLowerCase().includes(state.search.toLowerCase())&&(state.filter==="all"||s.status===state.filter));let rows=items.map(s=>'<tr><td><strong>'+esc(s.title)+'</strong><br><span class="muted small">'+esc(clientName(s.clientId))+'</span></td><td>'+date(s.date)+'</td><td>'+statusTag(s.status)+'</td><td>'+esc(s.technician||"—")+'</td><td>'+money(s.value)+'</td><td><button class="btn smallbtn" data-edit="service" data-id="'+s.id+'">Editar</button> <button class="btn smallbtn danger" data-delete="service" data-id="'+s.id+'">Excluir</button></td></tr>').join("");return '<div class="welcome"><div><h2>Ordens de serviço</h2><div class="muted">Acompanhe instalações, manutenções e visitas técnicas.</div></div></div>'+searchBar("Buscar por serviço, cliente ou endereço…","new-service",'<select class="filter" id="filterSelect"><option value="all">Todos os status</option>'+["Agendado","Em andamento","Concluído","Cancelado"].map(x=>'<option '+(state.filter===x?"selected":"")+'>'+x+'</option>').join("")+'</select>')+'<section class="panel">'+(rows?table(["Serviço / cliente","Data","Status","Responsável","Valor","Ações"],rows):empty("⚒","Nenhuma ordem encontrada","Registre o próximo atendimento da equipe.","new-service","＋ Nova ordem"))+'</section>'}
function settingsPage(){return '<div class="welcome"><div><h2>Dados e configurações</h2><div class="muted">Controle o backup e entenda como seus dados são armazenados.</div></div></div><div class="notice"><strong>Importante sobre armazenamento local</strong>Os registros ficam neste navegador e neste perfil de usuário. Eles não são sincronizados com outros computadores nem ficam salvos no repositório GitHub. Se limpar os dados do navegador, os registros podem ser perdidos.</div><div class="settings-grid"><section class="panel"><div class="panel-head"><h3>Backup dos dados</h3><span class="stat-icon">⇩</span></div><p class="muted">Exporte clientes, orçamentos e ordens de serviço em um arquivo JSON para guardar como cópia de segurança.</p><button class="btn primary" data-action="export">⇩ Exportar backup</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Restaurar backup</h3><p class="muted">Importe um arquivo exportado anteriormente. Os registros com os mesmos identificadores serão atualizados; os demais serão adicionados.</p><button class="btn" data-action="import">⇧ Importar arquivo JSON</button></section><section class="panel"><div class="panel-head"><h3>Armazenamento</h3><span class="stat-icon">▣</span></div><div class="detail"><div class="detail-item"><small>Banco ativo</small><strong>'+(fallback?"localStorage":"IndexedDB")+'</strong></div><div class="detail-item"><small>Clientes</small><strong>'+state.clients.length+'</strong></div><div class="detail-item"><small>Orçamentos</small><strong>'+state.quotes.length+'</strong></div><div class="detail-item"><small>Ordens de serviço</small><strong>'+state.services.length+'</strong></div></div><p class="muted small" style="margin-top:14px">Não inclua informações altamente sensíveis. Use senha no computador e mantenha os backups em local protegido.</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Apagar todos os dados</h3><p class="muted">Remove os cadastros locais deste sistema neste navegador. Essa ação não pode ser desfeita sem backup.</p><button class="btn danger" data-action="clear">Apagar todos os dados locais</button></section></div>'}
function render(){const content=$("#content");$("#pageTitle").textContent=titles[state.page]||"Hydro Star CRM";$("#nav").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));content.innerHTML=({dashboard,clients:clientsPage,quotes:quotesPage,services:servicesPage,settings:settingsPage}[state.page]||dashboard)();$("#headerAdd").textContent=state.page==="clients"?"＋ Novo cliente":state.page==="quotes"?"＋ Novo orçamento":state.page==="services"?"＋ Nova ordem":"＋ Novo cadastro";$("#headerAdd").onclick=()=>{if(state.page==="clients")openForm("client");else if(state.page==="quotes")openForm("quote");else if(state.page==="services")openForm("service");else showQuickModal()}}
function field(label,name,value="",type="text",opts=null,full=false,placeholder=""){let input;if(opts){input='<select name="'+name+'" '+(name==="clientId"?"required":"")+'><option value="">Selecione…</option>'+opts.map(o=>'<option value="'+esc(o.value)+'" '+(String(value)===String(o.value)?"selected":"")+'>'+esc(o.label)+'</option>').join("")+'</select>'}else if(type==="textarea"){input='<textarea name="'+name+'" placeholder="'+esc(placeholder)+'">'+esc(value)+'</textarea>'}else{input='<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(type==="number"?'min="0" step="0.01"':"")+' placeholder="'+esc(placeholder)+'" '+(["name","title","value"].includes(name)?"required":"")+'>'}return '<div class="field '+(full?"full":"")+'"><label>'+label+'</label>'+input+'</div>'}
function openForm(type,record=null){const isEdit=!!record;const title=({client:isEdit?"Editar cliente":"Novo cliente",quote:isEdit?"Editar orçamento":"Novo orçamento",service:isEdit?"Editar ordem de serviço":"Nova ordem de serviço"})[type];let fields="";
if(type==="client"){fields=field("Nome completo / empresa *","name",record?.name||"","text",null,true,"Nome do cliente")+field("Telefone / WhatsApp","phone",record?.phone||"","tel")+field("E-mail","email",record?.email||"","email")+field("Cidade","city",record?.city||"")+field("Perfil","kind",record?.kind||"Residencial","text",[{value:"Residencial",label:"Residencial"},{value:"Comercial",label:"Comercial"}])+field("Endereço","address",record?.address||"","text",null,true)+field("Observações","notes",record?.notes||"","textarea",null,true,"Informações úteis para atendimento")}
if(type==="quote"){fields=field("Título do orçamento *","title",record?.title||"","text",null,true,"Ex.: Instalação de banheira")+field("Cliente *","clientId",record?.clientId||"","text",state.clients.map(c=>({value:c.id,label:c.name})))+field("Data","date",record?.date||today(),"date")+field("Status","status",record?.status||"Pendente","text",["Pendente","Enviado","Aprovado","Cancelado"].map(x=>({value:x,label:x})))+field("Valor total (R$) *","value",record?.value??"","number")+field("Validade","validUntil",record?.validUntil||"","date")+field("Descrição / escopo","description",record?.description||"","textarea",null,true,"Serviços, materiais e condições")+field("Observações internas","notes",record?.notes||"","textarea",null,true,"Notas que não precisam constar no orçamento")}
if(type==="service"){fields=field("Título do serviço *","title",record?.title||"","text",null,true,"Ex.: Manutenção da banheira")+field("Cliente *","clientId",record?.clientId||"","text",state.clients.map(c=>({value:c.id,label:c.name})))+field("Data agendada","date",record?.date||today(),"date")+field("Status","status",record?.status||"Agendado","text",["Agendado","Em andamento","Concluído","Cancelado"].map(x=>({value:x,label:x})))+field("Responsável técnico","technician",record?.technician||"")+field("Valor estimado (R$)","value",record?.value??"","number")+field("Endereço do atendimento","address",record?.address||"","text",null,true)+field("Descrição / observações","description",record?.description||"","textarea",null,true,"Detalhes do atendimento")}
$("#modalRoot").innerHTML='<div style="position:fixed;inset:0;background:#071a2b99;z-index:20;display:grid;place-items:center;padding:14px" id="modalBackdrop"><section class="panel form-panel" style="width:min(100%,800px);max-height:92vh;overflow:auto"><div class="panel-head"><div><div class="muted small">'+(isEdit?"ATUALIZAÇÃO":"NOVO CADASTRO")+'</div><h3 style="font-size:21px;margin:3px 0">'+title+'</h3></div><button class="btn" data-action="close-modal" aria-label="Fechar">✕</button></div>'+(type!=="client"&&!state.clients.length?'<div class="notice">Cadastre um cliente antes de criar '+(type==="quote"?"um orçamento":"uma ordem de serviço")+'.</div>':'')+'<form id="recordForm" data-type="'+type+'" data-id="'+esc(record?.id||"")+'"><div class="form-grid">'+fields+'</div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" type="submit">Salvar cadastro</button></div></form></section></div>';
$("#modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});
if(type!=="client"&&!state.clients.length){$("#recordForm").querySelectorAll("input,select,textarea,button[type=submit]").forEach(el=>el.disabled=true)}
}
function closeModal(){$("#modalRoot").innerHTML=""}
function showQuickModal(){$("#modalRoot").innerHTML='<div style="position:fixed;inset:0;background:#071a2b99;z-index:20;display:grid;place-items:center;padding:14px" id="modalBackdrop"><section class="panel" style="width:min(100%,450px)"><div class="panel-head"><h3>O que deseja cadastrar?</h3><button class="btn" data-action="close-modal">✕</button></div><div class="quick-actions" style="grid-template-columns:1fr"><button class="quick" data-action="new-client"><strong>♙ Cliente</strong><span>Adicionar contato</span></button><button class="quick" data-action="new-quote"><strong>▤ Orçamento</strong><span>Registrar uma proposta</span></button><button class="quick" data-action="new-service"><strong>⚒ Ordem de serviço</strong><span>Organizar um atendimento</span></button></div></section></div>'}
async function onFormSubmit(form){const type=form.dataset.type;const fd=new FormData(form);const data=Object.fromEntries(fd.entries());data.id=form.dataset.id||id();data.createdAt=(form.dataset.id?({client:state.clients,quote:state.quotes,service:state.services}[type].find(x=>x.id===data.id)?.createdAt):new Date().toISOString())||new Date().toISOString();if(["quote","service"].includes(type))data.value=Number(data.value||0);if(type==="client"){data.name=data.name.trim();if(!data.name)return alert("Informe o nome do cliente.")}else{data.title=data.title.trim();if(!data.title||!data.clientId)return alert("Preencha o título e selecione o cliente.");if(data.value<0)return alert("O valor não pode ser negativo.")}await persist(type,data);closeModal();state.page=type==="client"?"clients":type==="quote"?"quotes":"services";render();toast("Cadastro salvo neste navegador.")}
function toast(message){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#102a43;color:#fff;padding:12px 18px;border-radius:10px;z-index:40;box-shadow:0 8px 30px #0002;max-width:90vw;text-align:center";document.body.appendChild(t)}t.textContent=message;t.style.display="block";clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.display="none",2800)}
async function deleteRecord(type,recordId){const names={client:"cliente",quote:"orçamento",service:"ordem de serviço"};if(type==="client"&&(state.quotes.some(q=>q.clientId===recordId)||state.services.some(s=>s.clientId===recordId)))return alert("Este cliente está vinculado a orçamentos ou serviços. Remova ou altere esses registros antes de excluir o cliente.");if(!confirm("Deseja excluir este "+names[type]+"? Esta ação não pode ser desfeita sem backup."))return;await removeRecord(type+":"+recordId);await load();render();toast("Registro excluído.")}
function exportData(){const payload={app:"Hydro Star CRM",version:1,exportedAt:new Date().toISOString(),clients:state.clients,quotes:state.quotes,services:state.services};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="hydro-star-crm-backup-"+today()+".json";a.click();URL.revokeObjectURL(url);toast("Backup exportado. Guarde o arquivo em local seguro.")}
async function importData(file){try{const payload=JSON.parse(await file.text());if(!payload||!Array.isArray(payload.clients)||!Array.isArray(payload.quotes)||!Array.isArray(payload.services))throw new Error("Formato inválido");if(!confirm("Importar "+payload.clients.length+" clientes, "+payload.quotes.length+" orçamentos e "+payload.services.length+" serviços? Registros com o mesmo ID serão atualizados."))return;for(const [type,list] of [["client",payload.clients],["quote",payload.quotes],["service",payload.services]])for(const item of list){if(!item.id)continue;await saveRecord({key:type+":"+item.id,type,data:item,updatedAt:new Date().toISOString()})}await load();render();toast("Backup importado com sucesso.")}catch(e){alert("Não foi possível importar esse arquivo. Confira se é um backup JSON válido do Hydro Star CRM.")}}
async function clearAll(){if(!confirm("Tem certeza de que deseja apagar TODOS os dados locais?"))return;if(!confirm("Última confirmação: se não tiver um backup, os dados não poderão ser recuperados. Continuar?"))return;if(db&&!fallback)await new Promise((resolve,reject)=>{const req=db.transaction(STORE,"readwrite").objectStore(STORE).clear();req.onsuccess=resolve;req.onerror=()=>reject(req.error)});else localStorage.removeItem(DB_NAME);await load();render();toast("Dados locais apagados.")}
document.addEventListener("click",async e=>{const navBtn=e.target.closest("[data-page]");if(navBtn){nav(navBtn.dataset.page);return}const navTo=e.target.closest("[data-nav]");if(navTo){nav(navTo.dataset.nav);return}const act=e.target.closest("[data-action]");if(act){const a=act.dataset.action;if(a==="close-modal")closeModal();else if(a==="new-client")openForm("client");else if(a==="new-quote")openForm("quote");else if(a==="new-service")openForm("service");else if(a==="export")exportData();else if(a==="import")$("#importFile").click();else if(a==="clear")clearAll();return}const edit=e.target.closest("[data-edit]");if(edit){const type=edit.dataset.edit;const arr={client:state.clients,quote:state.quotes,service:state.services}[type];openForm(type,arr.find(x=>x.id===edit.dataset.id));return}const del=e.target.closest("[data-delete]");if(del){deleteRecord(del.dataset.delete,del.dataset.id);return}});
document.addEventListener("submit",e=>{if(e.target.id==="recordForm"){e.preventDefault();onFormSubmit(e.target)}});
document.addEventListener("input",e=>{if(e.target.id==="searchInput"){state.search=e.target.value;const pos=e.target.selectionStart;render();const input=$("#searchInput");if(input){input.focus();input.setSelectionRange(pos,pos)}}});
document.addEventListener("change",e=>{if(e.target.id==="filterSelect"){state.filter=e.target.value;render()}if(e.target.id==="importFile"&&e.target.files?.[0]){importData(e.target.files[0]);e.target.value=""}});
$("#mobileMenu").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));
window.addEventListener("storage",()=>{load().then(render)});
load().then(render).catch(err=>{console.error(err);$("#content").innerHTML='<div class="notice">Não foi possível iniciar o armazenamento local. Tente abrir o sistema em um navegador atualizado.</div>'});
})();
</script>
